version: 2
# Weekly version updates, minor and patch grouped per ecosystem. Security
# updates are enabled separately in the repository settings and are not
# limited by this schedule. demo-video is a local render tool that is never
# deployed and is deliberately not tracked here.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades of the framework and toolchain are done by hand.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      - dependency-name: zod
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Stay on the Node 24 LTS line; revisit when Node 26 is LTS.
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      docs-site-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node 24 LTS line; revisit when Node 26 is LTS.
      - dependency-name: node
        update-types: [version-update:semver-major]
