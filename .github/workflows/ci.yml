name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build-time env validation runs with NODE_ENV=production; these are
      # CI-only values, never used at runtime. WorkOS is the default auth
      # provider, so its credentials are required at build; dummy values here
      # satisfy the schema (cookie password must be >=32 chars).
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DEMO_MODE: "true"
      WORKOS_API_KEY: sk_ci_only
      WORKOS_CLIENT_ID: client_ci_only
      WORKOS_COOKIE_PASSWORD: ci-only-cookie-password-0123456789abcdef
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://127.0.0.1:3100/auth/callback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check committed migrations match the schema
        run: |
          npx drizzle-kit generate --config docker/drizzle.config.ts --name ci_drift_check
          if [ -n "$(git status --porcelain docker/migrations)" ]; then
            echo "docker/migrations is out of date. Run: npm run db:generate -- --name <change>"
            git status --porcelain docker/migrations
            git diff -- docker/migrations
            exit 1
          fi
      - run: npm run db:push -- --force
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:docker
      - run: node --test scripts/changelog-publish.test.mjs
      - run: node scripts/changelog-publish.mjs --check
      - id: audit
        # Advisory only; the weekly Audit workflow tracks findings in an issue.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - if: steps.audit.outcome == 'failure'
        run: |
          {
            echo "## npm audit"
            echo
            echo "High or critical advisories were reported for production dependencies. See the audit step log."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create isolated Docker configuration
        run: |
          node scripts/setup-docker.mjs
          sed -i 's/localhost:3000/localhost:3102/g; s/HTTP_PORT=3000/HTTP_PORT=3102/' .env.docker
      - run: docker compose --env-file .env.docker build
      - run: docker compose --env-file .env.docker up -d --wait --wait-timeout 180
      - run: npx playwright install --with-deps chromium
      - name: Test the production image without provider credentials
        run: npm run test:e2e -- e2e/docker.spec.ts
        env:
          DOCKER_SMOKE: "true"
          PLAYWRIGHT_PORT: "3102"
      - name: Check migrations can run again without losing data
        run: docker compose --env-file .env.docker run --rm migrate
      - name: Container logs
        if: failure()
        run: docker compose --env-file .env.docker logs --tail 100 web migrate scheduler
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose --env-file .env.docker down -v
