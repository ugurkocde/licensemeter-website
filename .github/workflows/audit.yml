name: Audit

# Weekly production-dependency audit. The CI workflow reports advisories
# without failing pull requests; this run tracks them in a single issue.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=high | tee audit.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update the audit issue
        if: steps.audit.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="npm audit: high or critical advisories in production dependencies"
          body=$(printf 'The weekly audit reported advisories at or above the high level:\n\n```\n%s\n```\n\nRun: %s/actions/runs/%s' "$(head -c 60000 audit.txt)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
